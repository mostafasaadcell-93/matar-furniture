<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#17130F">
<title>Matar Furniture</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Matar Furniture, Gallery Matar. Luxury and comfort: exclusive salons, living rooms, bedrooms and dining rooms in Lebanon.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Inter:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: Citifurniture's page structure (hero slider, latest products, about band, gallery, offers, get in touch, two-tier footer; shop with left accordion) in Rital's own palette: wine + logo grey + a warm sand taken from their Instagram highlights. */
:root{
  --bg:#FFFFFF;
  --ink:#231D1D;
  --muted:#6F6866;
  --line:#ECE5E3;
  --stone:#F6F2F1;
  --wine:#8C1C21;
  --wine-deep:#6A1418;
  --wine-soft:#F8EDED;
  --grey:#7B7777;
  --grey-deep:#5E5A5A;
  --sand:#E2C29F;
  --sand-soft:#F4E7DA;
  --wa:#1E9E52;
  --white:#FFFFFF;
  --black:#141111;
  --f-display:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue","Inter","Segoe UI",sans-serif;
  --f-body:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue","Inter","Segoe UI",sans-serif;
  --r:12px;
  --wrap:1200px;
  color-scheme:light;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{scroll-behavior:smooth}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.6;-webkit-font-smoothing:antialiased;position:relative;overflow-x:hidden}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
img{display:block}
:focus-visible{outline:2px solid var(--wine);outline-offset:3px;border-radius:4px}
.wrap{max-width:var(--wrap);margin:0 auto;padding-left:max(20px,env(safe-area-inset-left,0px));padding-right:max(20px,env(safe-area-inset-right,0px))}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:700;letter-spacing:-.022em;line-height:1.1;text-wrap:balance;margin:0}
p{margin:0}
.muted{color:var(--muted)}
.title{text-align:center;color:var(--wine);text-transform:uppercase;font-size:clamp(1.9rem,4vw,3rem);font-weight:700;letter-spacing:-.01em}

/* Buttons */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:.55em;padding:.85em 1.5em;border-radius:6px;border:1.5px solid transparent;font-weight:700;font-size:.92rem;transition:background .2s,color .2s,filter .2s,transform .2s;white-space:nowrap}
.btn svg{width:17px;height:17px;flex:none}
.btn-wine{background:var(--wine);color:var(--white)}
.btn-wine:hover{background:var(--wine-deep)}
.btn-grey{background:var(--grey-deep);color:var(--white)}
.btn-grey:hover{background:var(--ink)}
.btn-sand{background:var(--sand);color:var(--ink)}
.btn-sand:hover{filter:brightness(.94)}
.btn-wa{background:var(--wa);color:var(--white)}
.btn-wa:hover{filter:brightness(.92)}
.btn-ghost{border-color:var(--ink);color:var(--ink)}
.btn-ghost:hover{background:var(--ink);color:var(--white)}
.btn.pill{border-radius:999px}
.btn.sm{padding:.6em 1em;font-size:.84rem}
.btn.full{width:100%}
.btn-explore{background:var(--wine);color:var(--white);border-radius:999px;padding:1.05em 2.6em;font-size:1.05rem;font-weight:700;letter-spacing:.02em;text-transform:uppercase}
.btn-explore:hover{background:var(--wine-deep);transform:translateY(-2px)}
.icon-btn{display:inline-grid;place-items:center;width:40px;height:40px;border-radius:50%;color:var(--grey);background:transparent;border:0;transition:color .2s,background .2s;flex:none}
.icon-btn:hover{color:var(--wine);background:var(--wine-soft)}
.icon-btn svg{width:22px;height:22px}

/* Home decoration (Citi-style corner blobs) */
.deco{position:absolute;inset:0 0 auto 0;height:760px;pointer-events:none;z-index:0;display:none}
body.is-home .deco{display:block}
.deco svg{position:absolute}
.blob-tl{left:0;top:0;width:clamp(200px,24vw,330px);height:auto}
.blob-dot{left:clamp(220px,22vw,320px);top:120px;width:34px;height:34px}
.blob-tr{right:0;top:0;width:clamp(120px,15vw,230px);height:auto}

/* Header */
.hdr{position:relative;z-index:5}
.hdr-in{display:flex;align-items:center;gap:1.5rem;height:116px}
.logo{display:flex;align-items:center;gap:.75rem;flex:none}
.logo svg{width:84px;height:28px}
.wm{display:flex;flex-direction:column;line-height:1}
.wm b{font-family:var(--f-display);font-weight:800;font-size:1.1rem;letter-spacing:.14em;color:var(--wine)}
.wm small{font-size:.64rem;letter-spacing:.06em;color:var(--muted);margin-top:.35rem}
.nav{display:flex;align-items:center;gap:.4rem;margin-left:auto}
.nav>a,.dd>a{display:inline-flex;align-items:center;gap:.3rem;padding:.5rem .9rem;font-weight:500;font-size:1.08rem;color:var(--wine);transition:color .2s}
.nav>a:hover,.dd>a:hover,.nav a.on{color:var(--grey-deep)}
.nav a.on{text-decoration:underline;text-underline-offset:8px;text-decoration-thickness:2px;text-decoration-color:var(--sand)}
.dd{position:relative}
.dd>a svg{width:13px;height:13px}
.dd-menu{position:absolute;top:100%;left:0;min-width:230px;background:var(--white);border-top:2px solid var(--wine);box-shadow:0 18px 40px -16px rgba(60,20,20,.25);padding:.4rem 0;opacity:0;visibility:hidden;transform:translateY(6px);transition:opacity .2s,transform .2s,visibility .2s;z-index:20}
.dd:hover .dd-menu,.dd:focus-within .dd-menu{opacity:1;visibility:visible;transform:none}
.dd-item{position:relative}
.dd-item>a{display:flex;flex-direction:row-reverse;justify-content:flex-end;gap:.5rem;align-items:center;padding:.5rem 1rem .5rem .8rem;color:var(--wine);font-size:.95rem}
.dd-item>a:hover{background:var(--wine-soft)}
.dd-item>a svg{width:12px;height:12px;transform:rotate(180deg);opacity:.7}
.dd-sub{position:absolute;right:100%;top:-.4rem;min-width:210px;background:var(--white);border-top:2px solid var(--wine);box-shadow:0 18px 40px -16px rgba(60,20,20,.25);padding:.4rem 0;opacity:0;visibility:hidden;transition:opacity .2s,visibility .2s}
.dd-item:hover .dd-sub,.dd-item:focus-within .dd-sub{opacity:1;visibility:visible}
.dd-sub a{display:block;padding:.45rem 1rem;font-size:.92rem;color:var(--ink)}
.dd-sub a:hover{background:var(--wine-soft);color:var(--wine)}
.socials{display:flex;gap:.1rem;margin-left:.6rem}
.burger{display:none;width:44px;height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--white);place-items:center;margin-left:auto}
.burger svg{width:22px;height:22px}
.mnav{display:none;position:relative;z-index:6}

/* Hero slider */
main{position:relative;z-index:1}
.slider{position:relative;padding-block:.5rem 1.2rem}
.slides{display:grid}
.slide{grid-area:1/1;opacity:0;visibility:hidden;transition:opacity .7s ease,visibility .7s}
.slide.on{opacity:1;visibility:visible}
.slide-in{display:grid;grid-template-columns:minmax(0,.9fr) minmax(0,1.1fr);gap:clamp(1.5rem,4vw,3rem);align-items:center;padding-left:max(90px,env(safe-area-inset-left,0px));padding-right:max(90px,env(safe-area-inset-right,0px))}
.slide-copy{display:grid;gap:1.1rem;justify-items:start;min-width:0}
.slide-copy h1,.slide-copy h2{color:var(--wine);font-size:clamp(2.3rem,4.6vw,3.9rem);letter-spacing:-.035em;line-height:1.04}
.slide-copy p{color:var(--wine);font-size:1.12rem;max-width:36ch;opacity:.9}
.slide-copy .btn-explore{margin-top:.6rem}
.slide-img{background:var(--stone);aspect-ratio:520/400;max-width:100%;overflow:hidden;position:relative}
.slide-img svg{width:100%;height:100%;display:block}
.s-arrow{position:absolute;top:50%;transform:translateY(-60%);width:54px;height:54px;border-radius:50%;border:3px solid var(--wine);background:rgba(255,255,255,.85);color:var(--wine);display:grid;place-items:center;z-index:3;transition:background .2s,color .2s}
.s-arrow:hover{background:var(--wine);color:var(--white)}
.s-arrow svg{width:24px;height:24px}
.s-arrow.prev{left:max(18px,env(safe-area-inset-left,0px))}
.s-arrow.next{right:max(18px,env(safe-area-inset-right,0px))}
.slider-foot{position:relative;height:96px;margin-top:-30px;overflow:hidden}
.slider-foot .wedge{position:absolute;right:0;bottom:0;width:62%;height:84px;background:var(--grey);clip-path:path("M0 84 C 80 84 70 0 200 0 L 2000 0 L 2000 84 Z")}
.slider-foot .circ{position:absolute;left:8%;bottom:-36px;width:90px;height:90px;border-radius:50%;background:var(--wine)}
.dots{display:flex;justify-content:center;gap:.5rem;padding-block:1rem}
.dots button{width:12px;height:12px;border-radius:50%;border:0;background:#C9C3C1;padding:0;transition:background .2s,transform .2s}
.dots button.on{background:var(--wine);transform:scale(1.15)}
.dots.small button{width:9px;height:9px}

/* Section shell */
.sec{padding-block:clamp(2.6rem,5vw,4.5rem)}
.sec .title{margin-bottom:clamp(1.8rem,4vw,3rem)}

/* Product carousel + cards */
.car{position:relative}
.track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 3.6rem)/4);gap:1.2rem;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none}
.track::-webkit-scrollbar{display:none}
.track>*{scroll-snap-align:start}
.c-arrow{position:absolute;top:calc(var(--img-h,50%) / 2);transform:translateY(-50%);width:36px;height:36px;border-radius:50%;border:0;background:rgba(255,255,255,.92);color:var(--wine);display:grid;place-items:center;box-shadow:0 4px 14px rgba(0,0,0,.12);z-index:2}
.c-arrow svg{width:18px;height:18px}
.c-arrow.prev{left:12px}
.c-arrow.next{right:12px}
.pcard{display:flex;flex-direction:column;min-width:0}
.pcard-img{display:block;position:relative;background:var(--stone);aspect-ratio:1;overflow:hidden}
.pcard-img svg,.pcard-img img{width:100%;height:100%;object-fit:cover;transition:transform .45s}
.pcard:hover .pcard-img svg,.pcard:hover .pcard-img img{transform:scale(1.05)}
.badge{position:absolute;top:10px;left:10px;background:var(--wine);color:var(--white);font-size:.66rem;font-weight:700;letter-spacing:.12em;text-transform:uppercase;padding:.28rem .55rem;border-radius:4px}
.pcard-body{padding:.9rem .1rem 0;display:flex;flex-direction:column;gap:.2rem;flex:1}
.pcard-cat{font-size:.84rem;color:var(--muted)}
.pcard-name{font-family:var(--f-body);font-weight:600;letter-spacing:-.01em;font-size:1.06rem;color:var(--wine)}
.pcard-name a:hover{text-decoration:underline;text-underline-offset:3px}
.pcard-actions{display:flex;margin-top:auto;padding-top:.7rem}
.pcard-actions .btn{width:100%}

/* About band */
.about-band{background:var(--wine);color:var(--white);position:relative;overflow:hidden}
.about-band .c1{position:absolute;left:-14%;top:-55%;width:min(560px,48vw);aspect-ratio:1;border-radius:50%;background:var(--grey)}
.about-band .c2{position:absolute;right:-10%;bottom:-48%;width:min(520px,44vw);aspect-ratio:1;border-radius:50%;background:linear-gradient(135deg,var(--sand),#C9A27E)}
.about-band .wrap{position:relative;z-index:1;text-align:center;display:grid;justify-items:center;gap:1.2rem;padding-block:clamp(3rem,6vw,4.5rem)}
.about-band h2{text-transform:uppercase;font-size:clamp(2rem,4vw,3rem)}
.about-band p{max-width:46ch;font-size:1.15rem;line-height:1.55}
.about-band .btn{margin-top:1.2rem;text-transform:uppercase;letter-spacing:.04em}

/* Gallery category tiles */
.cat-track{display:grid;grid-auto-flow:column;grid-auto-columns:calc((100% - 2rem)/3);gap:1rem;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;max-width:1100px;margin:0 auto}
.cat-track::-webkit-scrollbar{display:none}
.cat-tile{scroll-snap-align:start;background:var(--grey);color:var(--white);display:grid;place-items:center;min-height:100px;padding:1rem;font-size:clamp(1.15rem,2vw,1.5rem);font-weight:600;letter-spacing:-.01em;text-align:center;transition:background .2s}
.cat-tile:hover{background:var(--wine)}
.gal-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2rem 1.4rem;max-width:1100px;margin:2.6rem auto 0}
.center{text-align:center;margin-top:2.4rem}

/* Offers banner */
.offer{background:var(--wine);color:var(--white);position:relative;overflow:hidden}
.offer-in{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1.6fr) auto;align-items:center;min-height:250px;gap:1rem}
.offer-left h2{text-transform:uppercase;font-size:clamp(2rem,3.6vw,3rem);line-height:1.05}
.offer-left p{margin-top:1rem;font-size:1.15rem;opacity:.9;font-weight:300}
.offer-mid{align-self:stretch;display:grid;place-items:center;text-align:center;position:relative;padding:1.6rem 3rem}
.offer-mid::before{content:"";position:absolute;inset:0;background:var(--grey);clip-path:polygon(18% 0,100% 0,82% 100%,0 100%);z-index:0}
.offer-mid h3{position:relative;text-transform:uppercase;font-size:clamp(1.6rem,3.6vw,3rem);line-height:1.08;max-width:15ch}
.offer-right svg{width:90px;height:90px;color:var(--sand)}

/* Get in touch */
.git-head{background:var(--grey);color:var(--white);text-align:center;padding-block:2.4rem}
.git-head h2{text-transform:uppercase;font-size:clamp(1.9rem,3.6vw,2.8rem)}
.git{background:var(--wine);padding-block:3rem 4.5rem}
.git form{max-width:740px;margin:0 auto;display:grid;gap:.75rem}
.git input,.git textarea{width:100%;border:0;border-radius:2px;padding:1.05rem 1rem;background:#FAF8F8;font-weight:500;outline:0}
.git input:focus,.git textarea:focus{box-shadow:0 0 0 3px var(--sand)}
.git textarea{min-height:130px;resize:vertical}
.git .btn{justify-self:start;margin-top:.4rem;text-transform:uppercase}
.git .form-err{color:var(--sand)}
.git .ready{background:rgba(255,255,255,.12);color:var(--white)}

/* Footer */
.foot{background:var(--wine);color:var(--white)}
.foot-in{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,3fr);gap:2rem;padding-block:2.6rem 2.4rem}
.foot h4{font-size:1.3rem;font-weight:600;margin-bottom:1rem}
.foot-social{display:grid;gap:.35rem;justify-items:start}
.foot-social a{color:var(--sand);display:inline-flex;align-items:center;gap:.5rem;font-weight:600;font-size:.92rem}
.foot-social svg{width:22px;height:22px}
.foot-links{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:.8rem 1.4rem}
.foot-links a{font-weight:600;font-size:.95rem}
.foot-links a:hover{color:var(--sand)}
.foot-bar{background:var(--black);color:var(--white);text-align:center;padding-block:1.3rem;font-size:.86rem;font-weight:600;letter-spacing:.02em}

/* Page head (inner pages) */
.crumbs{font-size:.86rem;color:var(--muted);display:flex;flex-wrap:wrap;gap:.35rem}
.crumbs a:hover{color:var(--wine)}
.page-title{color:var(--wine);font-weight:500;font-size:clamp(2.2rem,4vw,3.1rem);letter-spacing:-.03em;margin:.8rem 0 1.6rem}

/* Shop (Citi: left search + accordion, right grid) */
.shop{display:grid;grid-template-columns:250px minmax(0,1fr);gap:2.6rem;padding-block:1.6rem 4.5rem;align-items:start}
.side{border-right:1px solid var(--line);padding-right:1.4rem;display:grid;grid-template-columns:minmax(0,1fr);gap:1.4rem;align-content:start;min-width:0}
.side>*{min-width:0}
.shop>div{min-width:0}
.side-search{display:flex;gap:.5rem;min-width:0}
.side-search input{flex:1 1 0;width:100%;min-width:0;border:0;padding:.75rem .8rem;border-radius:4px;font-size:.92rem;background:var(--grey-deep);color:var(--white);caret-color:var(--white)}
.side-search input::placeholder{color:rgba(255,255,255,.72)}
.side-search input:focus{outline:0;box-shadow:0 0 0 2px var(--sand)}
.side-search input::-webkit-search-cancel-button{filter:invert(1)}
.search-go{flex:none;width:44px;border:0;border-radius:4px;background:var(--wine);color:var(--white);display:grid;place-items:center;transition:background .2s}
.search-go:hover{background:var(--wine-deep)}
.search-go svg{width:19px;height:19px}
.acc{background:var(--wine);color:var(--white)}
.acc-row{display:flex;align-items:center;justify-content:space-between}
.acc-row a{flex:1;min-width:0;padding:.85rem 0 .85rem 1.1rem;font-weight:600;font-size:.95rem}
.acc-row a.on{text-decoration:underline;text-underline-offset:5px;text-decoration-color:var(--sand)}
.acc-row button{flex:none;background:transparent;border:0;color:var(--white);width:44px;height:46px;font-size:1.3rem;font-weight:400}
.acc-row button:hover{background:rgba(255,255,255,.1)}
.acc-row+.acc-subs+.acc-row,.acc-subs[hidden]+.acc-row{border-top:1px solid rgba(255,255,255,.12)}
.acc-subs{background:#FFF;padding:.3rem 0}
.acc-subs a{display:flex;justify-content:space-between;padding:.4rem 1.2rem;color:var(--ink);font-size:.9rem}
.acc-subs a:hover,.acc-subs a.on{color:var(--wine);background:var(--wine-soft)}
.acc-subs small,.acc-row small{opacity:.7;font-variant-numeric:tabular-nums}
.shop-bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;flex-wrap:wrap;margin-bottom:1.2rem}
.count{font-size:.92rem;font-weight:600}
.sel{border:1px solid #D8D2D0;padding:.55rem .8rem;border-radius:2px;background:var(--white);font-size:.9rem}
.grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:2rem 1.2rem}
.shop .grid{grid-template-columns:repeat(auto-fill,minmax(205px,1fr))}
.pager{display:flex;gap:.4rem;justify-content:center;margin-top:2.6rem;flex-wrap:wrap}
.pager button{min-width:40px;height:40px;border:1px solid var(--line);background:var(--white);border-radius:4px;font-weight:600}
.pager button.on{background:var(--wine);border-color:var(--wine);color:var(--white)}
.empty{grid-column:1/-1;background:var(--stone);padding:2.4rem;text-align:center;display:grid;gap:.8rem;justify-items:center}
.chips{display:none}

/* Product page */
.pd{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(2rem,5vw,3.6rem);padding-block:1rem 3.5rem;align-items:start}
.pd-stage{background:var(--stone);aspect-ratio:4/3;overflow:hidden}
.pd-stage svg,.pd-stage img{width:100%;height:100%;object-fit:cover}
.pd-thumbs{display:flex;gap:.6rem;margin-top:.7rem;flex-wrap:wrap}
.pd-thumbs button{width:76px;aspect-ratio:4/3;overflow:hidden;border:2px solid transparent;padding:0;background:var(--stone)}
.pd-thumbs button.on{border-color:var(--wine)}
.pd-thumbs img{width:100%;height:100%;object-fit:cover}
.pd-info{display:grid;gap:1.1rem;min-width:0}
.pd-info h1{color:var(--wine);font-weight:500;font-size:clamp(2rem,3.6vw,2.8rem);letter-spacing:-.03em}
.code{font-size:.82rem;font-weight:600;letter-spacing:.06em;color:var(--grey);font-variant-numeric:tabular-nums}
.pd-cta{display:flex;flex-wrap:wrap;gap:.6rem}
.meta{font-size:.92rem}
.meta a{color:var(--wine)}
.tabs{border-top:1px solid var(--line);padding-top:1rem}
.tab-label{display:inline-block;font-weight:700;color:var(--wine);border-bottom:2px solid var(--wine);padding-bottom:.4rem;margin-bottom:1rem;font-size:.95rem}
.tabs p{color:var(--muted);margin-bottom:.9rem}
.specs{margin:0;display:grid;gap:.7rem}
.specs dt{font-size:.78rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}
.specs dd{margin:.15rem 0 0;color:var(--muted);font-size:.95rem}
.swatches{display:flex;flex-wrap:wrap;gap:.5rem;margin-top:.35rem}
.swatch{display:inline-flex;align-items:center;gap:.45rem;padding:.3rem .75rem .3rem .35rem;border:1.5px solid var(--line);border-radius:999px;background:var(--white);font-size:.84rem;font-weight:600}
.swatch i{width:22px;height:22px;border-radius:50%;box-shadow:inset 0 0 0 1px rgba(0,0,0,.12)}
.swatch.on{border-color:var(--wine);color:var(--wine)}
.related h2{font-size:1.6rem;margin-bottom:1.4rem}

/* About page */
.about-grid{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:clamp(2rem,5vw,4rem);align-items:center}
.about-grid p{color:var(--muted);max-width:56ch}
.about-grid p+p{margin-top:1rem}
.values{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:1.4rem}
.value{text-align:center;display:grid;justify-items:center;gap:.6rem}
.value h3{color:var(--wine);font-size:1.3rem}
.value p{color:var(--muted);font-size:.95rem;max-width:30ch}

/* Contact (Citi: icon cards, centered form, map) */

const IMG_BASE = window.RITAL_IMG_BASE || "img/";
const PACKS = window.RITAL_PACKS || null;
const packLoads = {};
function loadPack(name) {
  if (!packLoads[name]) packLoads[name] = new Promise((res, rej) => { const s = document.createElement("script"); s.src = "data/" + name; s.onload = res; s.onerror = rej; document.head.appendChild(s); });
  return packLoads[name];
}
function srcFor(file, cb) {
  if (!PACKS) return cb(IMG_BASE + file);
  const store = window.RITAL_IMG || (window.RITAL_IMG = {});
  if (store[file]) return cb(store[file]);
  const pk = PACKS[file]; if (!pk) return;
  loadPack(pk).then(() => { if (store[file]) cb(store[file]); }, () => {});
}
function setSrc(el) { srcFor(el.dataset.src, u => { el.src = u; el.classList.add("ld"); }); }
const io = "IntersectionObserver" in window ? new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) { io.unobserve(e.target); setSrc(e.target); } }), { rootMargin: "400px 400px" }) : null;

const CART_KEY = "matar-cart-v1";
let cart = [];

function saveCart() { try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch (_) {} renderCartBadge(); }
const cartCount = () => cart.reduce((n, x) => n + x.q, 0);
const colorIdx = (p, ci) => p.colors && p.colors[ci] ? ci : -1;
const colorOf = it => { const p = BYID[it.id]; return it.c >= 0 && p.colors ? p.colors[it.c].n : (p.color || ""); };

function addToCart(id, ci, q = 1) {
  const p = BYID[id]; if (!p) return;
  const c = p.colors ? colorIdx(p, ci ?? 0) : -1;
  const it = cart.find(x => x.id === id && x.c === c);
  if (it) it.q = Math.min(99, it.q + q); else cart.push({ id, c, q: Math.min(99, q) });

}
// order link: id_qty[_color].id_qty[_color]  (only letters, digits, - _ . so WhatsApp keeps the whole link clickable)
const orderCode = items => items.map(it => `${it.id}_${it.q}${it.c >= 0 ? "_" + it.c : ""}`).join(".");
function parseOrder(code) {
  return String(code || "").split(".").map(t => { const [id, q, c] = t.split("_"); return { id, q: Math.max(1, Math.min(99, parseInt(q, 10) || 1)), c: c === undefined ? -1 : parseInt(c, 10) }; })
    .filter(it => BYID[it.id]).map(it => ({ ...it, c: colorIdx(BYID[it.id], it.c) }));
}
function cartMessage(f) {

  const s = new Set([1, n, cur, cur - 1, cur + 1]); if (cur <= 3) [2, 3, 4].forEach(x => s.add(x)); if (cur >= n - 2) [n - 1, n - 2, n - 3].forEach(x => s.add(x));
  const arr = [...s].filter(x => x >= 1 && x <= n).sort((a, b) => a - b), out = [];
  arr.forEach((x, i) => { if (i && x - arr[i - 1] > 1) out.push(0); out.push(x); });
  return out;
}
function renderGrid() {
  const g = document.getElementById("grid"); if (!g) return;
  const { filter, q, sort } = shopState;
  let list = PRODUCTS.filter(p => !filter || p.sub === filter || SUBS[p.sub].cat.id === filter);
  const terms = q.trim().toLowerCase().split(/\s+/).filter(Boolean);
  if (terms.length) list = list.filter(p => terms.every(t => p._s.includes(t)));
  list = list.slice();
  if (sort === "az") list.sort((a, b) => a.name.localeCompare(b.name, undefined, { numeric: true }));
  else if (sort === "code") list.sort((a, b) => a.code.localeCompare(b.code, undefined, { numeric: true }));
  const pages = Math.max(1, Math.ceil(list.length / PER_PAGE));
  if (shopState.page > pages) shopState.page = pages;
  const start = (shopState.page - 1) * PER_PAGE, shown = list.slice(start, start + PER_PAGE);
  document.getElementById("count").textContent = list.length
    ? (list.length === 1 ? "Showing 1 result" : list.length <= PER_PAGE ? `Showing all ${list.length} results` : `Showing ${start + 1}–${start + shown.length} of ${list.length.toLocaleString()} results`)
    : "No results";
  g.innerHTML = shown.length ? shown.map(card).join("") : `<div class="empty"><h3>No products match “${esc(q)}”</h3><p class="muted">Try another name or code, or ask us directly. We may have it in the showroom.</p><a class="btn btn-wa sm" href="${waLink("Hello " + CONFIG.brand + ", I'm looking for: " + q)}" target="_blank" rel="noopener">Ask on WhatsApp</a></div>`;
  const cur = shopState.page;
  document.getElementById("pager").innerHTML = pages > 1
    ? `<button data-page="${cur - 1}" ${cur === 1 ? "disabled" : ""} aria-label="Previous page">${ICON.chevL}</button>` +
      pageList(pages, cur).map(x => x ? `<button class="${x === cur ? "on" : ""}" data-page="${x}" ${x === cur ? 'aria-current="page"' : ""}>${x}</button>` : `<span class="gap">…</span>`).join("") +
      `<button data-page="${cur + 1}" ${cur === pages ? "disabled" : ""} aria-label="Next page">${ICON.chevR}</button>`
    : "";
  hydrate(g);
}

let slideTimer = null, slideIdx = 0;
function showSlide(i) {
  const slides = document.querySelectorAll(".slide"); if (!slides.length) return;
  slideIdx = (i + slides.length) % slides.length;
  slides.forEach((s, k) => {
    const on = k === slideIdx; s.classList.toggle("on", on); s.setAttribute("aria-hidden", String(!on));
    s.querySelectorAll("a").forEach(a => on ? a.removeAttribute("tabindex") : a.setAttribute("tabindex", "-1"));
    if (on) s.querySelectorAll("img[data-src]:not(.ld)").forEach(setSrc);
  });
  document.querySelectorAll("#slideDots button").forEach((d, k) => d.classList.toggle("on", k === slideIdx));
}
function startSlides() {
  clearInterval(slideTimer);
  if (matchMedia("(prefers-reduced-motion: reduce)").matches) return;
  slideTimer = setInterval(() => showSlide(slideIdx + 1), 6000);
}
function initCarousels() {
  document.querySelectorAll("[data-car]").forEach(car => {
    const id = car.dataset.car, tr = document.getElementById(id), dots = document.getElementById(id + "-dots");
    const items = tr.children; if (!items.length) return;
    dots.innerHTML = Array.from(items, (_, i) => `<button data-car-dot="${id}" data-i="${i}" aria-label="Item ${i + 1}"></button>`).join("");
    const sync = () => {
      const w = items[0].getBoundingClientRect().width + parseFloat(getComputedStyle(tr).columnGap || 0);
      const i = Math.round(tr.scrollLeft / (w || 1));
      dots.querySelectorAll("button").forEach((d, k) => d.classList.toggle("on", k === i));
      const img = items[0].querySelector(".pcard-img, img"); if (img) car.style.setProperty("--img-h", img.getBoundingClientRect().height + "px");
    };
    tr.addEventListener("scroll", () => requestAnimationFrame(sync), { passive: true });
    sync();
  });
}

function route() {
  const h = decodeURIComponent((location.hash || "#home").slice(1)) || "home";
  let html, key = h;
  clearInterval(slideTimer);
  if (h === "home") html = viewHome();
  else if (h === "shop") { html = viewShop(null); key = "shop"; }
  else if (h.startsWith("shop-")) { html = viewShop(h.slice(5)); key = "shop"; }
  else if (h.startsWith("p-")) { html = viewProduct(h.slice(2)); key = "shop"; }
  else if (h.startsWith("order=")) { html = viewOrder(h.slice(6)); key = "order"; }
  else if (h === "about") html = viewAbout();
  else if (h === "contact") html = viewContact();
  else { html = viewHome(); key = "home"; }
  document.body.classList.toggle("is-home", key === "home");
  const v = document.getElementById("view");
  v.style.animation = "none"; void v.offsetWidth; v.style.animation = "";
  v.innerHTML = html;
  if (key === "shop" && !h.startsWith("p-")) {
    renderGrid();
    v.querySelectorAll(".chips,.subchips").forEach(r => { const a = r.querySelector("a.on"); if (a && r.scrollWidth > r.clientWidth) r.scrollLeft += a.getBoundingClientRect().left - r.getBoundingClientRect().left - (r.clientWidth - a.offsetWidth) / 2; });
  }
  if (key === "home") { slideIdx = 0; startSlides(); }
  initCarousels();
  hydrate(v);
  if (h.startsWith("p-")) { const pi = document.getElementById("pdImg"); if (pi) setSrc(pi); }
  document.querySelectorAll("[data-nav]").forEach(a => a.classList.toggle("on", a.dataset.nav === key));
  closeMenu();
  window.scrollTo({ top: 0, behavior: "auto" });
}

document.addEventListener("click", (e) => {
  const c = e.target.closest("[data-add],[data-add-pd],[data-pq],[data-cart-open],[data-cart-close],[data-cart-clear],[data-cq],[data-cx],[data-order-add]");
  if (c) {
    if (c.hasAttribute("data-add")) { e.preventDefault(); addToCart(c.dataset.add, 0, 1); }
    else if (c.hasAttribute("data-add-pd")) { const q = parseInt(document.getElementById("pdQty").textContent, 10) || 1; const p = BYID[c.dataset.addPd]; addToCart(p.id, p.colors ? p.colors.findIndex(x => x.n === pdColor) : -1, q); }
    else if (c.hasAttribute("data-pq")) { const el = document.getElementById("pdQty"); el.textContent = Math.max(1, Math.min(99, (parseInt(el.textContent, 10) || 1) + Number(c.dataset.pq))); }
    else if (c.hasAttribute("data-cart-open")) { document.getElementById("toast").hidden = true; openCart(); }
    else if (c.hasAttribute("data-cart-close")) closeCart();
    else if (c.hasAttribute("data-cart-clear")) { cart = []; saveCart(); renderCart(); closeCart(); }
    else if (c.hasAttribute("data-cq")) { const it = cart[Number(c.dataset.cq)]; if (it) { it.q = Math.max(1, Math.min(99, it.q + Number(c.dataset.d))); saveCart(); renderCart(); } }
    else if (c.hasAttribute("data-cx")) { cart.splice(Number(c.dataset.cx), 1); saveCart(); renderCart(); }
    else if (c.hasAttribute("data-order-add")) { parseOrder(c.dataset.orderAdd).forEach(it => { const ex = cart.find(x => x.id === it.id && x.c === it.c); if (ex) ex.q = Math.min(99, ex.q + it.q); else cart.push(it); }); saveCart(); openCart(); }
    return;
  }
  const t = e.target.closest("[data-slide],[data-goto],[data-car-go],[data-car-dot],[data-acc],[data-page],[data-color],[data-img],[data-copy]");
  if (!t) return;
  if (t.hasAttribute("data-slide")) { showSlide(slideIdx + Number(t.dataset.slide)); startSlides(); }
  else if (t.hasAttribute("data-goto")) { showSlide(Number(t.dataset.goto)); startSlides(); }
  else if (t.hasAttribute("data-car-go")) { const tr = document.getElementById(t.dataset.carGo); tr.scrollBy({ left: Number(t.dataset.dir) * tr.clientWidth * .75, behavior: "smooth" }); }
  else if (t.hasAttribute("data-car-dot")) { const tr = document.getElementById(t.dataset.carDot), it = tr.children[Number(t.dataset.i)]; if (it) tr.scrollTo({ left: it.offsetLeft - tr.offsetLeft, behavior: "smooth" }); }
  else if (t.hasAttribute("data-acc")) { const box = document.getElementById("acc-" + t.dataset.acc), open = box.hidden; box.hidden = !open; t.textContent = open ? "−" : "+"; t.setAttribute("aria-expanded", String(open)); }
  else if (t.hasAttribute("data-page")) {
    if (t.disabled) return;
    shopState.page = Number(t.dataset.page); renderGrid();
    document.querySelector(".shop").scrollIntoView({ behavior: "smooth" });
  }
  else if (t.hasAttribute("data-color")) {
    const p = pdProduct, c = p && p.colors && p.colors[Number(t.dataset.color)]; if (!c) return;
    document.querySelectorAll(".swatch").forEach(s => s.classList.toggle("on", s === t));
    pdColor = c.n; document.getElementById("pdColorName").textContent = c.n;
    document.getElementById("pdWa").href = waLink(msgOrder(p, pdColor));
    document.getElementById("pdCall").href = callLink(p, pdColor);
    showPhoto(c.i);
  }
  else if (t.hasAttribute("data-img")) showPhoto(Number(t.dataset.img));
  else if (t.hasAttribute("data-copy")) {
    const done = () => { t.textContent = "Copied"; setTimeout(() => t.textContent = "Copy number", 1600); };
    const fallback = () => { const n = document.getElementById("waNum"); if (n) { const r = document.createRange(); r.selectNodeContents(n); const s = getSelection(); s.removeAllRanges(); s.addRange(r); } t.textContent = "Selected"; };
    try { navigator.clipboard.writeText(t.dataset.copy).then(done, fallback); } catch (_) { fallback(); }
  }
});
document.addEventListener("keydown", (e) => { if (e.key !== "Escape") return; if (!drawer().hidden) closeCart(); });
document.addEventListener("mouseover", (e) => { if (e.target.closest(".slider")) clearInterval(slideTimer); });
document.addEventListener("mouseout", (e) => { if (e.target.closest(".slider") && !e.relatedTarget?.closest?.(".slider")) startSlides(); });

let qTimer = null;
document.addEventListener("input", (e) => {
  if (e.target.id === "q" || e.target.id === "q2") { shopState.q = e.target.value; shopState.page = 1; clearTimeout(qTimer); qTimer = setTimeout(renderGrid, 150); }
});
document.addEventListener("change", (e) => { if (e.target.id === "sort") { shopState.sort = e.target.value; shopState.page = 1; renderGrid(); } });

const phoneOk = v => v.replace(/[^\d]/g, "").length >= 7;
const val = id => document.getElementById(id).value.trim();
function prepare(prefix, required, build) {
  const err = document.getElementById(prefix + "Err");
  for (const [id, msg] of required) { if (!val(id)) { err.textContent = msg; err.hidden = false; return; } }
  err.hidden = true;
  const url = waLink(build());
  document.getElementById(prefix + "Send").href = url;
  if (openWa(url)) { document.getElementById(prefix + "Ready").hidden = true; return; }
  document.getElementById(prefix + "Ready").hidden = false;
}
function openWa(url) {
  // one new tab with the message already written; returns false if the browser blocked it
  let w = null;
  try { w = window.open(url, "_blank"); } catch (_) {}
  if (!w) return false;
  try { w.opener = null; } catch (_) {}
  return true;
}
document.addEventListener("submit", (e) => {
  const f = e.target;
  if (f.hasAttribute("data-search")) {
    e.preventDefault(); shopState.q = f.querySelector("input").value; shopState.page = 1;
    if (!location.hash.startsWith("#shop")) location.hash = "#shop"; else renderGrid();
    return;
  }
  if (f.id === "cartForm") {
    e.preventDefault();
    const err = document.getElementById("oErr"), name = val("oName"), phone = val("oPhone");
    if (!cart.length) return;
    if (!name || !phoneOk(phone)) { err.textContent = !name ? "Please enter your name." : "Please enter a phone number with at least 7 digits."; err.hidden = false; return; }
    err.hidden = true;
    const url = waLink(cartMessage({ name, phone, region: val("oRegion"), address: val("oAddress"), notes: val("oNotes") }));
    document.getElementById("oSend").href = url;
    if (openWa(url)) { document.getElementById("oReady").hidden = true; f.hidden = true; document.getElementById("cartSent").hidden = false; }
    else document.getElementById("oReady").hidden = false;
    return;
  }
  if (f.id === "msgForm") {
    e.preventDefault();
    prepare("g", [["gName", "Please enter your name."], ["gMsg", "Please write your message."]],
      () => `Hello ${CONFIG.brand},${val("gSubject") ? "\nSubject: " + val("gSubject") : ""}\n${val("gMsg")}\n\nName: ${val("gName")}${val("gPhone") ? "\nPhone: " + val("gPhone") : ""}`);
    return;
  }
  if (f.id === "contactForm") {
    e.preventDefault();
    prepare("m", [["mName", "Please enter your name."], ["mMsg", "Please write your message."]],
      () => `Hello ${CONFIG.brand},${val("mSubject") ? "\nSubject: " + val("mSubject") : ""}\n${val("mMsg")}\n\nName: ${val("mName")}${val("mPhone") ? "\nPhone: " + val("mPhone") : ""}`);
  }
});
window.addEventListener("resize", () => document.querySelectorAll("[data-car]").forEach(car => { const img = car.querySelector(".pcard-img, img"); if (img) car.style.setProperty("--img-h", img.getBoundingClientRect().height + "px"); }));

buildChrome();
renderCartBadge();
window.addEventListener("hashchange", route);
route();
</script>
